name: service-sdk

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"

      - name: Install deps
        run: uv sync --locked --python 3.10

      - name: Regenerate proto stubs and check for drift
        run: |
          uv run python scripts/generate_proto.py
          git diff --exit-code -- src/da_service_sdk/generated

      - name: Run unit tests
        run: uv run pytest tests/unit -q

      - name: Build wheel
        run: uv build
