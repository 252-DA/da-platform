name: images

# Build image prod và đẩy lên GHCR (docs/ke-hoach-deploy-cloud.md GĐ2).
# VM chỉ `pull`: deploy/deploy.sh <sha>.
#
# Chạy tự động từ ci.yaml sau khi test xanh trên push vào dev/master, hoặc tay
# qua workflow_dispatch (build từ một nhánh bất kỳ, kể cả khi test đang đỏ).
#
# Tag :<sha> là SHA của meta-repo. SHA này đã cố định commit của mọi submodule,
# nên một tag ứng với đúng một bộ code. Thêm tag theo tên nhánh (:dev, :master)
# để biết bản mới nhất của mỗi nhánh.
#
# Repo public nên package mới tạo cũng nên để Public (Org 252-DA → Packages →
# <package> → Package settings → Change visibility) để VM pull không cần đăng
# nhập. Image không chứa secret (.dockerignore loại .env và web/keys;
# core-api/keys chỉ có public key).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web,               file: web/Dockerfile,               target: runner }
          - { name: core-api,          file: core-api/Dockerfile,          target: prod }
          - { name: core-api-migrate,  file: core-api/Dockerfile,          target: migrate }
          # Một image cho cả 6 worker; compose prod chỉ khác command.
          - { name: worker,            file: worker/Dockerfile,            target: "" }
          - { name: embedding-service, file: embedding-service/Dockerfile, target: "" }
          - { name: mcp-service,       file: mcp-service/Dockerfile,       target: "" }
          - { name: ai-tutor,          file: ai-tutor/Dockerfile,          target: "" }
    steps:
      # Image worker và embedding-service nặng vài GB (torch); runner chỉ có ~14 GB trống.
      - name: Dọn đĩa
        if: matrix.name == 'worker' || matrix.name == 'embedding-service'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Submodule (trừ report)
        run: bash scripts/ci/init-submodules.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/252-da/da-${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Tóm tắt
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
