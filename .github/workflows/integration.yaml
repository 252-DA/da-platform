name: integration

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

# da-platform (this repo) had no CI workflow before this file — see
# docs/embedding-service-migration.md §7. This is where cross-repo
# consistency checks live: every consumer repo pins its sibling
# dependencies by SHA in its own workflows, independently of the
# gitlinks committed here, and those two pins have to be compared.
permissions:
  contents: read

jobs:
  check-materialize-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify consumer CI pins match committed gitlinks
        run: python3 scripts/check_materialize_pins.py

      - name: Verify contract, prompt and parser agree on the quiz item shape
        run: python3 scripts/check_content_schema.py
