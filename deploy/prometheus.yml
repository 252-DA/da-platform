global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - prometheus-alerts.yml

scrape_configs:
  # Prometheus tự giám sát chính nó
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # workers (METRICS__PORT 9091/9092/9093/9094/9096)
  - job_name: workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - "document-worker:9091"
          - "enrichment-worker:9092"
          - "outbox-worker:9093"
          - "content-generation-worker:9094"
          - "answer-grading-worker:9096"
        labels:
          tier: worker

  # core-api (NestJS): prom-client + /metrics (Prometheus text format 0.0.4)
  - job_name: core-api
    metrics_path: /metrics
    static_configs:
      - targets: ["core-api:4000"]
