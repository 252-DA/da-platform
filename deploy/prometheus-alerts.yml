# Alert rules cho core-api (NestJS).
# Được nạp qua rule_files trong prometheus.yml.
# Lưu ý: observability compose chưa có AlertManager — các rule này chỉ được
# đánh giá (evaluation) và hiển thị trên trang Alerts của Prometheus
# (http://<prometheus>:9090/alerts) cho tới khi có AlertManager.

groups:
  - name: core-api
    rules:
      - alert: CoreOutboxEventsDeadLetter
        # Gauge dựa trên COUNT(*) WHERE status='DEAD_LETTER' — không có
        # first-sample problem như increase() trên counter, và phản ánh đúng
        # state sau restart/downtime. Từ migration 20261107120000 outbox không
        # còn FAILED: relay lỗi thì thử lại có backoff, lần lỗi thứ 10
        # (MAX_RELAY_FAILURES) mới thành DEAD_LETTER.
        # Lưu ý: core-api hiện chưa export gauge này (chưa có /metrics).
        expr: core_outbox_events_dead_letter > 0
        for: 0m
        labels:
          severity: warning
          service: core-api
        annotations:
          summary: "Có outbox events ở trạng thái DEAD_LETTER (core-api)"
          description: >-
            Ít nhất một outbox event đã relay lỗi MAX_RELAY_FAILURES lần và
            chuyển sang status 'DEAD_LETTER'. Kiểm tra bảng outbox_events:
            SELECT event_id, event_type, retry_count, last_error
            FROM outbox_events
            WHERE status = 'DEAD_LETTER'
            ORDER BY occurred_at DESC;
            Đẩy lại một dòng: UPDATE outbox_events SET status = 'PENDING',
            retry_count = 0, next_retry_at = now() WHERE event_id = '...';

      - alert: CoreQueueFailedJobs
        # Gauge dựa trên Queue.getFailedCount() — phản ánh failed jobs còn giữ
        # trong Redis kể cả khi Core restart (failed jobs được retain).
        expr: core_queue_failed_jobs > 0
        for: 0m
        labels:
          severity: warning
          service: core-api
        annotations:
          summary: "BullMQ queues có failed jobs (core-api)"
          description: >-
            Có job trên queue outbox_relay / content_generation đang ở trạng
            thái failed (đã hết retry). Xem label queue để biết queue nào, và
            kiểm tra failed reason trong BullMQ / log của worker tương ứng.
