x-common-env: &common-env
  APP__ENV: development
  APP__LOG_LEVEL: INFO
  APP__JSON_LOGS: "true"
  # Qdrant
  QDRANT__HOST: qdrant
  QDRANT__PORT: "6333"
  QDRANT__COLLECTION_NAME: documents
  QDRANT__VECTOR_SIZE: "1024"
  # MinIO
  MINIO__ENDPOINT: minio:9000
  MINIO__ACCESS_KEY: minioadmin
  MINIO__SECRET_KEY: minioadmin
  MINIO__BUCKET_NAME: documents
  MINIO__SECURE: "false"
  # PostgreSQL
  SQL__ENABLED: "true"
  SQL__DSN: postgresql://postgres:postgres@postgres:5432/chunking
  SQL__POOL_SIZE: "5"
  # Neo4j
  NEO4J__ENABLED: "true"
  NEO4J__URI: bolt://neo4j:7687
  NEO4J__USERNAME: neo4j
  NEO4J__PASSWORD: changeme123
  NEO4J__DATABASE: neo4j
  # Redis
  REDIS__HOST: redis
  REDIS__PORT: "6379"
  # Embedder
  EMBEDDER__PROVIDER: bge
  EMBEDDER__BGE_MODEL: BAAI/bge-m3
  EMBEDDER__BGE_USE_FP16: "true"
  # Tracing (disabled by default)
  TRACING__ENABLED: "false"
  # LLM — model được chọn bằng TÊN PROFILE trong catalog của ai-sdk
  # (ai-sdk/src/ai_runtime/catalog.py, xem docs/model-routing-design.md).
  # Compose chỉ khai báo những núm có thể xoay; để trống thì dùng TASK_DEFAULTS
  # trong catalog. Đổi model = đặt một biến dưới đây trong .env rồi restart.
  LLM_PROFILE: ${LLM_PROFILE:-}
  LLM_PROFILE__ENRICHMENT: ${LLM_PROFILE__ENRICHMENT:-}
  # Key đi theo provider, không theo task: catalog chỉ giữ TÊN biến env.
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  # Metrics
  METRICS__ENABLED: "true"

x-chunking-v2-volumes: &chunking-v2-volumes
  - ./scripts/dev_reload.py:/app/dev_reload.py:ro
  - ./packages-ai/src:/app/src
  - ./packages-ai/pyproject.toml:/app/pyproject.toml:ro
  - ./packages-ai/uv.lock:/app/uv.lock:ro

x-worker-volumes: &worker-volumes
  - ./scripts/dev_reload.py:/app/worker/dev_reload.py:ro
  - ./worker/worker:/app/worker/worker
  - ./worker/pyproject.toml:/app/worker/pyproject.toml:ro
  - ./worker/uv.lock:/app/worker/uv.lock:ro
  - ./packages-ai/src:/app/packages-ai/src
  - ./packages-ai/pyproject.toml:/app/packages-ai/pyproject.toml:ro
  - ./packages-ai/uv.lock:/app/packages-ai/uv.lock:ro
  - ./ai-sdk/src:/app/ai-sdk/src
  - ./ai-sdk/pyproject.toml:/app/ai-sdk/pyproject.toml:ro
  - ./service-sdk/src:/app/service-sdk/src
  - ./service-sdk/pyproject.toml:/app/service-sdk/pyproject.toml:ro
  - ./service-sdk/uv.lock:/app/service-sdk/uv.lock:ro

x-worker-entrypoint: &worker-entrypoint ["uv", "run", "--frozen", "python", "-m"]

# ─────────────────────────────────────────────────────────
# Infrastructure
# ─────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chunking
    ports:
      - "5432:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      default: {}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      default: {}

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      default: {}

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      default: {}

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/changeme123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p changeme123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default: {}

  # ─────────────────────────────────────────────────────────
  # Application — gRPC server (LEGACY)
  # Bề mặt trùng lặp với core-api: core-api enqueue job qua BullMQ, không gọi
  # gRPC/HTTP của packages-ai. Giữ dưới profile "legacy" trong lúc migration,
  # xóa hẳn sau khi E2E remote embedding ổn định — xem
  # docs/embedding-service-migration.md §9 bước 13.
  # Image packages-ai chưa cài da_service_sdk (Dockerfile thiếu
  # --extra remote-embedding) nên nhóm legacy vẫn phải dùng BGE cục bộ qua
  # EMBEDDER__PROVIDER mặc định của common-env.
  # ─────────────────────────────────────────────────────────
  grpc-server:
    profiles: ["legacy"]
    build:
      context: ./packages-ai
      dockerfile: Dockerfile
    command: ["dev_reload", "document_chunk.delivery.grpc.server", "/app/src"]
    environment:
      <<: *common-env
      PYTHONPATH: /app/src
      GRPC__HOST: "0.0.0.0"
      GRPC__PORT: "50051"
      GRPC__MAX_WORKERS: "10"
      METRICS__PORT: "9090"
    ports:
      - "50051:50051"
      - "9090:9090"
    volumes: *chunking-v2-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default: {}

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - "./deploy/cloudflared.da-platform.yml:/etc/cloudflared/config.yml:ro"
      - "./.cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro"
    depends_on:
      - web
    restart: unless-stopped
    networks:
      default: {}

  # ─────────────────────────────────────────────────────────
  # HTTP API (FastAPI / Swagger) — LEGACY, trùng với core-api.
  # Retire cùng grpc-server, xem docs/embedding-service-migration.md §9 bước 13.
  # ─────────────────────────────────────────────────────────
  http-api:
    profiles: ["legacy"]
    build:
      context: ./packages-ai
      dockerfile: Dockerfile
    command: ["uvicorn", "document_chunk.delivery.http.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    environment:
      <<: *common-env
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes: *chunking-v2-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default: {}

  # ─────────────────────────────────────────────────────────
  # MCP learning-context server — LEGACY, thay bằng mcp-service (§9 bước 11).
  # Không publish port 8001 nữa: mcp-service giữ port đó. Truy cập nội bộ qua
  # mcp-server:8001 vẫn hoạt động khi bật profile "legacy".
  # ─────────────────────────────────────────────────────────
  mcp-server:
    profiles: ["legacy"]
    build:
      context: ./packages-ai
      dockerfile: Dockerfile
    command: ["dev_reload", "document_chunk.delivery.mcp.server", "/app/src"]
    environment:
      <<: *common-env
      PYTHONPATH: /app/src
      MCP__HOST: "0.0.0.0"
      MCP__PORT: "8001"
      MCP__PATH: /mcp
      METRICS__ENABLED: "false"
    volumes: *chunking-v2-volumes
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8001),2); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default: {}

  # ─────────────────────────────────────────────────────────
  # Next.js frontend (placeholder — scaffolded in web/)
  # ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: dev
    command: ["pnpm", "dev", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      REDIS_URL: redis://redis:6379
      CORE_API_INTERNAL_URL: http://core-api:4000
      BFF_TO_CORE_PRIVATE_KEY_PATH: /keys/bff-to-core.pem
      BFF_TO_CORE_KEY_ID: bff-2026-05
      LTI_LMS_TYPE: ${LTI_LMS_TYPE:-openedx}
      LTI_PLATFORM_URL: ${LTI_PLATFORM_URL:-http://local.edly.io}
      LTI_ISSUER_URL: ${LTI_ISSUER_URL:-}
      LTI_AUTH_URL: ${LTI_AUTH_URL:-}
      LTI_JWKS_URL: ${LTI_JWKS_URL:-}
      LTI_TOKEN_URL: ${LTI_TOKEN_URL:-}
      LTI_DEPLOYMENT_ID: ${LTI_DEPLOYMENT_ID:-}
      LTI_REDIRECT_URI: ${LTI_REDIRECT_URI:-http://localhost:3000/lti/launch}
      LTI_KEY_ID: ${LTI_KEY_ID:-ai-nextjs-1}
      LTI_CLIENT_ID: ${LTI_CLIENT_ID:-ai-nextjs-1}
      LTI_PRIVATE_KEY_PATH: /keys/lti.pem
      LTI_PUBLIC_KEY_PATH: /keys/lti.pub.pem
      LTI_COOKIE_SAMESITE: ${LTI_COOKIE_SAMESITE:-lax}
      LTI_COOKIE_SECURE: ${LTI_COOKIE_SECURE:-}
    volumes:
      - "./web:/app"
      # Trước đây mount thẳng ./core-api/proto: web (repo riêng) với tay vào
      # repo core-api, không pin, không version. Giờ cả hai service cùng đọc
      # một nguồn duy nhất trong da-platform.
      - "./contracts/proto:/app/proto:ro"
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
      - "./web/keys:/keys:ro"
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - core-api
      - redis
    restart: unless-stopped
    networks:
      default: {}

  # ─────────────────────────────────────────────────────────
  # NestJS Business Logic Core API
  # ─────────────────────────────────────────────────────────
  core-api:
    build:
      context: .
      dockerfile: core-api/Dockerfile
      target: dev
    command: ["./node_modules/.bin/nest", "start", "--watch"]
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chunking
      REDIS_URL: redis://redis:6379
      MINIO__ENDPOINT: minio:9000
      MINIO__ACCESS_KEY: minioadmin
      MINIO__SECRET_KEY: minioadmin
      MINIO__BUCKET_NAME: documents
      MINIO__SECURE: "false"
      BFF_TO_CORE_PUBLIC_KEY_PATH: /app/keys/bff-to-core.pub.pem
      BFF_TO_CORE_JWT_ISSUER: web-bff
      BFF_TO_CORE_JWT_AUDIENCE: core-api
      # AGS score writeback — dùng chung LTI identity với web (web verify
      # id_token và phục vụ JWKS; core-api ký client assertion để đẩy điểm).
      # Cùng key, cùng client_id, nên phải cùng giá trị với service `web` ở trên.
      LTI_CLIENT_ID: ${LTI_CLIENT_ID:-ai-nextjs-1}
      LTI_KEY_ID: ${LTI_KEY_ID:-ai-nextjs-1}
      LTI_LMS_TYPE: ${LTI_LMS_TYPE:-openedx}
      LTI_PLATFORM_URL: ${LTI_PLATFORM_URL:-http://local.edly.io}
      LTI_TOKEN_URL: ${LTI_TOKEN_URL:-}
      LTI_PRIVATE_KEY_PATH: /lti-keys/lti.pem
      AGS_ENABLED: ${AGS_ENABLED:-}
      AGS_POLL_INTERVAL_MS: ${AGS_POLL_INTERVAL_MS:-15000}
      # Đồng bộ đề cương từ trang Chương trình học của Canvas (REST API).
      CANVAS_API_URL: ${CANVAS_API_URL:-${CANVAS_PUBLIC_URL:-}}
      CANVAS_API_TOKEN: ${CANVAS_API_TOKEN:-}
      CANVAS_AUTO_SYNC_ENABLED: ${CANVAS_AUTO_SYNC_ENABLED:-true}
      CANVAS_SYNC_INTERVAL_MS: ${CANVAS_SYNC_INTERVAL_MS:-900000}
      CANVAS_SYNC_LAUNCH_COOLDOWN_MS: ${CANVAS_SYNC_LAUNCH_COOLDOWN_MS:-120000}
      CI: "true"
    volumes:
      - "./core-api:/app"
      # core_api.proto không còn nằm trong repo core-api — nó là contract
      # giữa core-api và web nên sống ở contracts/proto/. Mount vào
      # /app/proto vì grpc-server.service.ts đọc process.cwd()/proto/.
      - "./contracts/proto:/app/proto:ro"
      - core_api_node_modules:/app/node_modules
      - "./core-api/keys:/app/keys:ro"
      - "./web/keys:/lti-keys:ro"
    ports:
      - "4000:4000"
      - "50052:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default: {}

  # ─────────────────────────────────────────────────────────
  # embedding-service — sole process holding the BGE-M3 model.
  # No DB/Qdrant/MinIO dependency: see
  # docs/embedding-service-migration.md §9 step 3-4.
  # ─────────────────────────────────────────────────────────
  embedding-service:
    build:
      context: .
      dockerfile: embedding-service/Dockerfile
    environment:
      APP__ENV: development
      APP__LOG_LEVEL: INFO
      GRPC__HOST: "0.0.0.0"
      GRPC__PORT: "50051"
      GRPC__MAX_WORKERS: "4"
      METRICS__ENABLED: "true"
      METRICS__PORT: "9095"
      MODEL__BGE_MODEL: BAAI/bge-m3
      MODEL__BGE_USE_FP16: "true"
      MODEL__DIMENSION: "1024"
      MODEL__ENCODE_BATCH_SIZE: "4"
      MODEL__MAX_LENGTH: "1024"
      MODEL__MAX_RPC_BATCH_SIZE: "32"
      # bge = nạp model vào RAM (~3GB); openai = gọi embeddings API, không nạp model.
      MODEL__BACKEND: ${EMBEDDING_BACKEND:-bge}
      API__BASE_URL: ${EMBEDDING_API_BASE_URL:-}
      API__KEY: ${EMBEDDING_API_KEY:-}
      API__MODEL: ${EMBEDDING_API_MODEL:-BAAI/bge-m3}
      API__DIMENSIONS: ${EMBEDDING_API_DIMENSIONS:-}
      HF_HOME: /root/.cache/huggingface
    ports:
      - "50061:50051"
      - "9095:9095"
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; ch = grpc.insecure_channel('localhost:50051'); resp = health_pb2_grpc.HealthStub(ch).Check(health_pb2.HealthCheckRequest(service='da_platform.embedding.v1.EmbeddingService'), timeout=5); exit(0 if resp.status == health_pb2.HealthCheckResponse.SERVING else 1)",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    networks:
      default: {}

  # ─────────────────────────────────────────────────────────
  # Workers
  # ─────────────────────────────────────────────────────────
  document-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    entrypoint: *worker-entrypoint
    command: ["dev_reload", "worker.runners.document_worker", "/app/worker/worker", "/app/packages-ai/src", "/app/service-sdk/src"]
    environment:
      <<: *common-env
      WORKER_TYPE: document
      WORKER_CONCURRENCY: "1"
      HEALTH_PORT: "8081"
      METRICS__PORT: "9091"
      EMBEDDER__PROVIDER: grpc
      EMBEDDER__GRPC_TARGET: embedding-service:50051
    ports:
      - "8081:8081"
      - "9091:9091"
    volumes: *worker-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    restart: unless-stopped

  enrichment-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    entrypoint: *worker-entrypoint
    command: ["dev_reload", "worker.runners.enrichment_worker", "/app/worker/worker", "/app/packages-ai/src"]
    environment:
      <<: *common-env
      WORKER_TYPE: enrichment
      WORKER_CONCURRENCY: "4"
      HEALTH_PORT: "8082"
      METRICS__PORT: "9092"
    ports:
      - "8082:8082"
      - "9092:9092"
    volumes: *worker-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  content-generation-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    entrypoint: *worker-entrypoint
    command:
      [
        "dev_reload",
        "worker.runners.content_generation_worker",
        "/app/worker/worker",
        "/app/packages-ai/src",
        "/app/ai-sdk/src",
      ]
    environment:
      <<: *common-env
      WORKER_TYPE: content_generation
      WORKER_CONCURRENCY: "2"
      # Ba vai trò trong sinh quiz, ba profile độc lập — cùng một process vẫn
      # gọi được hai model khác nhau. Để trống thì lấy TASK_DEFAULTS của catalog
      # (viết câu: deepseek-chat, chấm: gemini-flash — judge phải khác model
      # vừa viết câu, xem docs/quiz-generation-redesign.md §7.8).
      LLM_PROFILE__QUIZ_GENERATION: ${LLM_PROFILE__QUIZ_GENERATION:-}
      LLM_PROFILE__QUIZ_VERIFICATION: ${LLM_PROFILE__QUIZ_VERIFICATION:-}
      LLM_PROFILE__QUIZ_REGENERATION: ${LLM_PROFILE__QUIZ_REGENERATION:-}
      HEALTH_PORT: "8084"
      METRICS__PORT: "9094"
      LEARNING_CONTEXT_MCP_ENABLED: "true"
      LEARNING_CONTEXT_MCP_URL: http://mcp-service:8001/mcp
      LEARNING_CONTEXT_MCP_TIMEOUT_SECONDS: "30"
      LEARNING_CONTEXT_MCP_FALLBACK_TO_LOCAL: "true"
    ports:
      - "8084:8084"
      - "9094:9094"
    volumes: *worker-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-service:
        condition: service_healthy
    restart: unless-stopped

  outbox-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    entrypoint: *worker-entrypoint
    command: ["dev_reload", "worker.runners.outbox_worker", "/app/worker/worker", "/app/packages-ai/src"]
    environment:
      <<: *common-env
      WORKER_TYPE: outbox
      WORKER_CONCURRENCY: "1"
      HEALTH_PORT: "8083"
      METRICS__PORT: "9093"
    ports:
      - "8083:8083"
      - "9093:9093"
    volumes: *worker-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # mcp-service — split từ packages-ai/delivery/mcp. Không dùng Neo4j (đã
  # verify hai MCP tool không đụng graph); embedding qua GrpcEmbedder, không
  # load BGE cục bộ. Xem docs/embedding-service-migration.md §9 bước 11.
  # ─────────────────────────────────────────────────────────
  mcp-service:
    build:
      context: .
      dockerfile: mcp-service/Dockerfile
    environment:
      APP__ENV: development
      APP__LOG_LEVEL: INFO
      APP__JSON_LOGS: "true"
      SQL__ENABLED: "true"
      SQL__DSN: postgresql://postgres:postgres@postgres:5432/chunking
      QDRANT__HOST: qdrant
      QDRANT__PORT: "6333"
      QDRANT__COLLECTION_NAME: documents
      QDRANT__VECTOR_SIZE: "1024"
      EMBEDDER__PROVIDER: grpc
      EMBEDDER__GRPC_TARGET: embedding-service:50051
      MCP__HOST: "0.0.0.0"
      MCP__PORT: "8001"
      MCP__PATH: /mcp
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8001),2); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default: {}

  # ─────────────────────────────────────────────────────────
  # document-inspector — dev-only, không DB, không embedding. Chỉ chạy khi
  # gọi rõ profile "tools" (docker compose --profile tools up document-inspector).
  # ─────────────────────────────────────────────────────────
  document-inspector:
    build:
      context: .
      dockerfile: document-inspector/Dockerfile
    environment:
      APP__ENV: development
      APP__LOG_LEVEL: INFO
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["tools"]
    restart: unless-stopped
    networks:
      default: {}

volumes:
  pgdata18:
  redisdata:
  qdrantdata:
  miniodata:
  neo4jdata:
  web_node_modules:
  web_next_cache:
  core_api_node_modules:
  hf_cache:

networks:
  default: {}
