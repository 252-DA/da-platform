syntax = "proto3";

package ai_lms.v1;

message EmptyRequest {}

message JsonRequest {
  string json = 1;
}

message JsonResponse {
  string json = 1;
}

service CoreApiService {
  rpc LaunchSync(JsonRequest) returns (JsonResponse);

  rpc ListCourses(EmptyRequest) returns (JsonResponse);
  rpc GetCourse(JsonRequest) returns (JsonResponse);
  rpc ListChapters(JsonRequest) returns (JsonResponse);
  rpc ListLearningOutcomes(JsonRequest) returns (JsonResponse);

  rpc SyncCurriculumFromCanvas(JsonRequest) returns (JsonResponse);
  rpc ListCurriculumImports(JsonRequest) returns (JsonResponse);
  rpc ApplyCurriculumImport(JsonRequest) returns (JsonResponse);

  rpc CreateUploadSession(JsonRequest) returns (JsonResponse);
  rpc ConfirmUpload(JsonRequest) returns (JsonResponse);
  rpc ListDocuments(JsonRequest) returns (JsonResponse);
  rpc GetDocument(JsonRequest) returns (JsonResponse);
  rpc GetDocumentChunks(JsonRequest) returns (JsonResponse);
  // URL đọc file, hạn ngắn; server của web fetch rồi stream lại cho trình duyệt.
  rpc GetDocumentFileUrl(JsonRequest) returns (JsonResponse);
  rpc DeleteDocument(JsonRequest) returns (JsonResponse);
  rpc SyncDocumentsFromCanvas(JsonRequest) returns (JsonResponse);
  rpc UpdateDocumentPlacement(JsonRequest) returns (JsonResponse);

  rpc ListLessons(JsonRequest) returns (JsonResponse);
  rpc GetLesson(JsonRequest) returns (JsonResponse);
  rpc GetLessonCards(JsonRequest) returns (JsonResponse);
  rpc GetLessonQuiz(JsonRequest) returns (JsonResponse);
  rpc PublishLesson(JsonRequest) returns (JsonResponse);

  rpc ListReviewDrafts(JsonRequest) returns (JsonResponse);
  rpc ApproveCard(JsonRequest) returns (JsonResponse);
  rpc RejectCard(JsonRequest) returns (JsonResponse);
  rpc UpdateCard(JsonRequest) returns (JsonResponse);
  rpc ApproveQuizItem(JsonRequest) returns (JsonResponse);
  rpc RejectQuizItem(JsonRequest) returns (JsonResponse);
  rpc UpdateQuizItem(JsonRequest) returns (JsonResponse);

  rpc SubmitQuiz(JsonRequest) returns (JsonResponse);
  rpc GetCanvasQuizContext(JsonRequest) returns (JsonResponse);
  rpc CreateQuizSet(JsonRequest) returns (JsonResponse);
  rpc GetQuizSet(JsonRequest) returns (JsonResponse);
  rpc GetQuizBuilderContext(JsonRequest) returns (JsonResponse);
  rpc StartQuizSet(JsonRequest) returns (JsonResponse);
  rpc SubmitQuizSet(JsonRequest) returns (JsonResponse);
  rpc GetQuizSetResults(JsonRequest) returns (JsonResponse);
  rpc ListQuizAttempts(JsonRequest) returns (JsonResponse);
  rpc ListEssaysForReview(JsonRequest) returns (JsonResponse);
  rpc GradeEssayAnswer(JsonRequest) returns (JsonResponse);
  rpc RetryEssayGrading(JsonRequest) returns (JsonResponse);

  rpc CreateContentGenerationRequest(JsonRequest) returns (JsonResponse);
  rpc ListContentGenerationRequests(JsonRequest) returns (JsonResponse);

  // Chọn model AI cho từng task (chỉ admin). Danh sách profile hợp lệ:
  // llm_model_catalog.json cạnh file này.
  rpc ListModelBindings(JsonRequest) returns (JsonResponse);
  rpc SetModelBinding(JsonRequest) returns (JsonResponse);

  // Chấm bài luận nộp file qua LTI Asset Processor (docs/essay-asset-processor.md).
  // ReceiveAssetNotices chỉ nhận danh tính hệ thống "lti-notice" của web.
  rpc CreateEssayProcessor(JsonRequest) returns (JsonResponse);
  rpc UpdateEssayProcessor(JsonRequest) returns (JsonResponse);
  rpc GetEssayProcessor(JsonRequest) returns (JsonResponse);
  rpc ReceiveAssetNotices(JsonRequest) returns (JsonResponse);
  rpc GetEssayReport(JsonRequest) returns (JsonResponse);

  // Micro Content
  rpc ListMicroContents(JsonRequest) returns (JsonResponse);
  rpc GetMicroContent(JsonRequest) returns (JsonResponse);
  rpc CreateMicroContent(JsonRequest) returns (JsonResponse);
  rpc UpdateMicroContent(JsonRequest) returns (JsonResponse);
  rpc DeleteMicroContent(JsonRequest) returns (JsonResponse);
  rpc PublishMicroContent(JsonRequest) returns (JsonResponse);
  rpc SaveMicroContentQuestions(JsonRequest) returns (JsonResponse);
  rpc CreateMicroContentUpload(JsonRequest) returns (JsonResponse);
  rpc ConfirmMicroContentUpload(JsonRequest) returns (JsonResponse);
  rpc GetMicroContentVideoUrl(JsonRequest) returns (JsonResponse);
  rpc RequestMicroContentScript(JsonRequest) returns (JsonResponse);
  rpc SaveMicroContentScript(JsonRequest) returns (JsonResponse);
  rpc RequestMicroContentRender(JsonRequest) returns (JsonResponse);
  rpc ReportMicroContentProgress(JsonRequest) returns (JsonResponse);
  rpc SubmitMicroContent(JsonRequest) returns (JsonResponse);
  rpc GetMicroContentResult(JsonRequest) returns (JsonResponse);
  rpc ListMicroContentAttempts(JsonRequest) returns (JsonResponse);
}

