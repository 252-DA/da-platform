[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-inspector"
version = "0.1.0"
description = "Dev-only FastAPI tool to inspect parse/chunk quality — no storage, no DB, no embedding"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

# llamaindex extra: needed for the "sentence"/"token"/"semantic" chunker
# strategies in /documents/inspect/chunking. fastapi/uvicorn/python-magic
# already ship in document-chunk's base dependencies.
dependencies = [
    "document-chunk[llamaindex]",
    "uvicorn>=0.35.0",
    # torch is transitive via llama-index-embeddings-huggingface — listed
    # directly so tool.uv.sources.torch below actually applies, see
    # embedding-service/pyproject.toml for the full explanation.
    "torch",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
document-chunk = { path = "../packages-ai", editable = true }
torch = [{ index = "pytorch-cpu" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=document_inspector --cov-report=term-missing"
